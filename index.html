<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root {
  --bg: #0a0d0c;
  --bg-2: #111614;
  --surface: #161c1a;
  --surface-2: #1d2422;
  --surface-3: #252d2a;
  --line: #232b29;
  --line-2: #2e3835;
  --text: #e8efed;
  --text-2: #97a39f;
  --text-3: #5d6964;
  --accent: #00d68f;
  --accent-dim: #008f5f;
  --accent-glow: rgba(0, 214, 143, 0.15);
  --danger: #ff4d4d;
  --warn: #ffb648;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sora', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}
input, textarea { user-select: text; }
button { font-family: inherit; cursor: pointer; }

/* Atmospheric grain texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.025;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ============================================================
   APP SHELL
============================================================ */
#app {
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--safe-bot) + 96px);
  position: relative;
}

.screen {
  padding: 24px 20px 32px;
  animation: fadeIn 0.25s ease-out;
}
/* Set by render() when the screen didn't change — no entrance animation replay */
#app.no-anim .screen, #app.no-anim .garage-pure { animation: none; }
/* Set by render() when a sheet was already open — don't slide it up again */
#app.sheet-static .sheet, #app.sheet-static .sheet-backdrop { animation: none; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   TOP BAR
============================================================ */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px 0;
}
.topbar .icon-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text-2);
  display: grid; place-items: center;
  transition: all 0.15s;
}
.topbar .icon-btn:active { transform: scale(0.92); background: var(--surface); }
.menu-btn { border: none; }
.menu-btn span {
  display: block;
  width: 22px; height: 2px;
  background: var(--text-2);
  margin: 4px 0;
  border-radius: 1px;
}

/* ============================================================
   TYPOGRAPHY
============================================================ */
h1.page-title {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 16px 0 28px;
  line-height: 1.0;
}
h2.section-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 28px 0 14px;
}
.label {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.005em;
  margin-bottom: 8px;
  display: block;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
}

/* ============================================================
   BUTTONS / CARDS
============================================================ */
.cta-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 26px 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  width: 100%;
  margin: 24px 0;
  transition: all 0.15s;
}
.cta-card:active { transform: scale(0.99); background: var(--surface-2); }
.cta-card .plus {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  display: grid; place-items: center;
  font-weight: 700;
}

.btn-primary {
  background: var(--accent);
  color: #001a11;
  border: none;
  border-radius: 999px;
  padding: 18px 24px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  letter-spacing: -0.005em;
  transition: all 0.15s;
  box-shadow: 0 0 0 0 var(--accent-glow);
}
.btn-primary:active { transform: scale(0.98); box-shadow: 0 0 0 6px var(--accent-glow); }
.btn-primary[disabled] { background: var(--surface-2); color: var(--text-3); }

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
}
.btn-ghost:active { background: var(--surface); }

.btn-pill {
  background: var(--accent);
  color: #001a11;
  border: none;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 15px;
  font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px;
}

.btn-danger-text {
  background: transparent;
  color: var(--danger);
  border: 1px solid rgba(255,77,77,0.3);
  border-radius: 999px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  width: 100%;
}

/* ============================================================
   FORM INPUTS
============================================================ */
.field { margin-bottom: 22px; }
.input, .textarea, .select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--accent-dim);
  background: var(--surface-2);
}
.input::placeholder, .textarea::placeholder {
  color: var(--text-3);
}
.textarea { min-height: 90px; resize: vertical; }
.input-row {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding-right: 14px;
}
.input-row .input {
  background: transparent;
  border: none;
  flex: 1;
}
.unit-toggle {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 4px;
}
.help-text {
  font-size: 13px;
  color: var(--text-3);
  margin-top: 8px;
  line-height: 1.5;
}

/* Owner's-manual data: specs list, Maintenance Minder decoder */
.spec-list {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.spec-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.spec-row:last-child { border-bottom: none; }
.spec-row .k {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  padding-top: 3px;
  flex-shrink: 0;
}
.spec-row .v { text-align: right; color: var(--text); line-height: 1.4; }
.minder {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.minder .input {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
}
.minder-out { margin-top: 14px; }
.minder-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.minder-item .code {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--accent);
  width: 22px;
  flex-shrink: 0;
  padding-top: 1px;
}
.minder-item .what { font-size: 14px; line-height: 1.45; }
.minder-item .what small { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }
.minder-item.unknown .code { color: var(--danger); }
.minder-legend {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.6;
}
.minder-legend b { color: var(--text-2); font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.link-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  margin-top: 12px;
}

/* ============================================================
   GARAGE / VEHICLES — "garage stall" cards
============================================================ */
.vehicle-card {
  background:
    linear-gradient(180deg, var(--surface) 0%, var(--bg-2) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
  transition: all 0.15s;
  cursor: pointer;
  text-align: left;
  color: inherit;
  width: 100%;
  padding: 0;
  display: block;
}
.vehicle-card:active { transform: scale(0.99); border-color: var(--line-2); }

/* the "stall" — concrete floor + back wall vibe */
.stall {
  position: relative;
  height: 200px;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0, 214, 143, 0.06) 0%, transparent 70%),
    linear-gradient(180deg, #0c100f 0%, #15191a 60%, #1a1f1d 100%);
  border-bottom: 1px solid var(--line);
}
/* faint floor lines like a bay */
.stall::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%),
    repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,0.02) 60px 61px);
  background-position: center bottom;
  background-size: 100% 100%, 100% 40%;
  background-repeat: no-repeat, no-repeat;
  pointer-events: none;
}
/* spotlight from above */
.stall::after {
  content: '';
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  height: 100px;
  background: radial-gradient(ellipse 100% 100% at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
  pointer-events: none;
}
.stall img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}
/* Floating mode - for transparent PNG cutouts */
.stall.floating img {
  inset: auto;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  max-width: 88%;
  max-height: 80%;
  object-fit: contain;
  filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.55)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4));
  z-index: 2;
}
/* gradient overlay so the title area stays readable & it feels stylized */
.stall.has-photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,13,12,0) 40%, rgba(10,13,12,0.55) 100%);
  z-index: 2;
  pointer-events: none;
}
/* car-shaped "shadow" on the floor when no image present */
.stall .placeholder {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  z-index: 2;
  color: var(--text-3);
  opacity: 0.45;
}
.stall .placeholder svg,
.stall .placeholder img.car-silhouette {
  width: 100%;
  height: auto;
  display: block;
}
.car-silhouette {
  /* invert so the silhouette becomes white-ish on dark background, then dim */
  filter: invert(1) brightness(0.85);
  opacity: 0.35;
}
.stall .add-photo-prompt {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  z-index: 3;
  background: rgba(0, 0, 0, 0.4);
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
}

/* card content under the stall */
.vehicle-card .vbody {
  padding: 16px 20px 18px;
}
.vehicle-card .vname {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin-bottom: 3px;
  line-height: 1.15;
}
.vehicle-card .vmeta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.vehicle-card .vstats {
  display: flex;
  gap: 22px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line-2);
}
.vstat .num {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1;
}
.vstat .lbl {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ============================================================
   GARAGE CAROUSEL — swipeable car gallery
============================================================ */
/* PURE mode — full-screen photo only */
.garage-pure {
  position: fixed;
  inset: 0;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--safe-bot) + 96px); /* leave room for bottom nav */
  z-index: 1;
  animation: fadeIn 0.25s ease-out;
}
.pure-carousel {
  height: 100%;
  padding: 0 !important;
  scroll-padding-left: 0 !important;
}
.pure-slide {
  flex: 0 0 100vw !important;
  padding: 0 !important;
  height: 100%;
  position: relative;
}
.pure-stall {
  position: relative;
  height: 100%;
  width: 100%;
  background:
    radial-gradient(ellipse 80% 55% at 50% 100%, rgba(0, 214, 143, 0.07) 0%, transparent 70%),
    linear-gradient(180deg, #0a0d0c 0%, #14181a 50%, #1d2422 100%);
  cursor: pointer;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* concrete floor — wider, more atmospheric for full screen */
.pure-stall::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(ellipse 70% 25% at 50% 95%, rgba(255,255,255,0.05) 0%, transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 100px, rgba(255,255,255,0.018) 100px 101px);
  background-position: center bottom;
  background-size: 100% 100%, 100% 40%;
  background-repeat: no-repeat, no-repeat;
  pointer-events: none;
  z-index: 1;
}
/* spotlight from above */
.pure-stall::after {
  content: '';
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  height: 240px;
  background: radial-gradient(ellipse 100% 100% at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}
.pure-stall img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}
.pure-stall.has-photo img {
  position: relative;
  inset: auto;
  width: 86%;
  height: auto;
  max-height: 52%;
  border-radius: 18px;
  box-shadow: 0 30px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
  z-index: 2;
}

.pure-stall.floating img {
  position: relative;
  inset: auto;
  width: auto;
  height: auto;
  max-width: 82%;
  max-height: 60%;
  object-fit: contain;
  filter:
    drop-shadow(0 24px 18px rgba(0, 0, 0, 0.65))
    drop-shadow(0 6px 6px rgba(0, 0, 0, 0.5));
  z-index: 2;
}

.pure-placeholder {
  position: relative;
  width: 75%;
  z-index: 2;
  color: var(--text-3);
  opacity: 0.4;
}
.pure-placeholder svg, .pure-placeholder img.car-silhouette { width: 100%; height: auto; display: block; }

.pure-stall-add {
  display: flex;
  align-items: center;
  justify-content: center;
}
.pure-stall-add::before, .pure-stall-add::after { display: none; }
.pure-stall-add .add-circle {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  display: grid;
  place-items: center;
  z-index: 2;
}
.pure-stall-add .add-circle svg { width: 36px; height: 36px; }

/* Pulsing red alert dot above the car */
.alert-dot {
  position: absolute;
  top: calc(var(--safe-top) + 24px);
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--danger);
  z-index: 10;
  box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7);
  animation: pulseDot 1.8s ease-out infinite;
}
@keyframes pulseDot {
  0%   { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.55); transform: translateX(-50%) scale(1); }
  60%  { box-shadow: 0 0 0 14px rgba(255, 77, 77, 0); transform: translateX(-50%) scale(1.05); }
  100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); transform: translateX(-50%) scale(1); }
}

.carousel {
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 0 12px 8px;
  gap: 0;
  scroll-padding-left: 12px;
}
.carousel::-webkit-scrollbar { display: none; }

.slide {
  flex: 0 0 calc(100vw - 24px);
  scroll-snap-align: start;
  scroll-snap-stop: always;
  padding: 0 8px;
  box-sizing: border-box;
}

/* ============================================================
   SERVICE LOG
============================================================ */
.service-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  transition: all 0.15s;
}
.service-item:active { background: var(--surface-2); }
.service-item .stitle {
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 2px;
}
.service-item .smeta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.service-item .scost {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--accent);
  font-size: 15px;
  white-space: nowrap;
}
.service-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--surface-3);
  display: grid; place-items: center;
  flex-shrink: 0;
  color: var(--text-2);
}
.service-icon svg { width: 18px; height: 18px; }

/* ============================================================
   REMINDERS
============================================================ */
.reminder-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.reminder-item.overdue { border-left-color: var(--danger); }
.reminder-item.soon { border-left-color: var(--warn); }
.reminder-item .rtitle { font-weight: 600; font-size: 15px; }
.reminder-item .rmeta { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.reminder-item .check-btn {
  margin-left: auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  color: var(--text-2);
  display: grid; place-items: center;
}
.reminder-item .check-btn:active { background: var(--accent); color: #001a11; border-color: var(--accent); }

/* Service checklist (in the Log Service sheet) */
.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
}
.check-row .box {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--line-2);
  display: grid; place-items: center;
  color: transparent;
  flex-shrink: 0;
  transition: all 0.12s;
}
.check-row .box svg { width: 14px; height: 14px; }
.check-row .ct { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
.check-row .cm { font-size: 12px; color: var(--text-3); margin-top: 1px; }
.check-row .tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  flex-shrink: 0;
}
.check-row.on { border-color: var(--accent-dim); }
.check-row.on .box { background: var(--accent); border-color: var(--accent); color: #001a11; }
.check-row.on .tag { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: transparent;
  border: 1px solid var(--line-2);
  color: var(--text-2);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.12s;
}
.chip.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
.chip.custom { border-style: dashed; }
.add-item-row { display: flex; gap: 8px; margin-top: 10px; }
.add-item-row .input { flex: 1; }
.add-item-row .btn-ghost { padding: 12px 16px; flex-shrink: 0; }
.service-item .sitems { font-size: 13px; color: var(--text-2); margin-top: 3px; line-height: 1.5; }

/* ============================================================
   EMPTY STATES
============================================================ */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-3);
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.6;
}
.empty-title {
  color: var(--text-2);
  font-weight: 600;
  font-size: 17px;
  margin-bottom: 6px;
}
.empty-sub { font-size: 14px; }

/* ============================================================
   BOTTOM NAV
============================================================ */
.bottomnav {
  position: fixed;
  bottom: calc(var(--safe-bot) + 12px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20, 26, 24, 0.85);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px;
  display: flex;
  gap: 4px;
  z-index: 50;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.navtab {
  background: transparent;
  border: none;
  color: var(--text-3);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: all 0.2s;
  min-width: 76px;
  letter-spacing: 0.02em;
}
.navtab svg { width: 19px; height: 19px; stroke-width: 1.75; }
.navtab.active {
  background: var(--surface-2);
  color: var(--accent);
}
.navtab:active { transform: scale(0.95); }

/* ============================================================
   MODAL / SHEET
============================================================ */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  animation: fadeBd 0.2s ease-out;
}
@keyframes fadeBd { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg-2);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  z-index: 101;
  max-height: 92vh;
  overflow-y: auto;
  padding: 18px 20px calc(var(--safe-bot) + 28px);
  animation: slideUp 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  border-top: 1px solid var(--line);
  -webkit-overflow-scrolling: touch;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet-handle {
  width: 40px; height: 4px;
  background: var(--line-2);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.sheet-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.close-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--surface-3);
  border: none;
  color: var(--text);
  display: grid; place-items: center;
  font-size: 18px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(var(--safe-bot) + 100px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  color: var(--text);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  z-index: 200;
  animation: toastIn 0.2s ease-out;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* Detail header */
.detail-hero {
  background: linear-gradient(160deg, var(--surface) 0%, var(--bg-2) 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.detail-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
}
.detail-stall {
  position: relative;
  height: 160px;
  margin: -22px -22px 18px;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0, 214, 143, 0.06) 0%, transparent 70%),
    linear-gradient(180deg, #0c100f 0%, #15191a 60%, #1a1f1d 100%);
  border-bottom: 1px solid var(--line);
  display: grid;
  place-items: end center;
  overflow: hidden;
  z-index: 1;
}
.detail-stall img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.detail-stall.floating img {
  inset: auto;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  max-width: 88%;
  max-height: 85%;
  object-fit: contain;
  filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.55)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4));
}
.detail-stall.floating::after { display: none; }
.detail-stall::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,13,12,0) 30%, rgba(10,13,12,0.7) 100%);
  z-index: 2;
  pointer-events: none;
}
.detail-hero h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 2;
}
.detail-hero .submeta {
  margin-top: 6px;
  position: relative;
  z-index: 2;
}
.spec-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
  position: relative;
}
.spec {
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.spec .lbl {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
}
.spec .val {
  font-size: 17px;
  font-weight: 700;
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 6px;
  background: var(--surface);
  padding: 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
  margin-bottom: 18px;
}
.tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-3);
  padding: 10px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.tab.active {
  background: var(--surface-3);
  color: var(--accent);
}

/* photo grid */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.photo-thumb {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line);
}
.photo-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.photo-add {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1.5px dashed var(--line-2);
  display: grid; place-items: center;
  color: var(--text-3);
  font-size: 28px;
}
.photo-thumb .del-x {
  position: absolute;
  top: 4px; right: 4px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  border: none;
  color: white;
  font-size: 12px;
  display: grid; place-items: center;
}

/* Hero photo uploader (in vehicle form) */
.hero-uploader {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hero-preview {
  position: relative;
  height: 180px;
  border-radius: var(--radius);
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0, 214, 143, 0.06) 0%, transparent 70%),
    linear-gradient(180deg, #0c100f 0%, #15191a 60%, #1a1f1d 100%);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
}
.hero-preview img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-preview.floating img {
  inset: auto;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  max-width: 88%;
  max-height: 80%;
  object-fit: contain;
  filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.55)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4));
}
.hero-busy {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: grid;
  place-items: center;
  background: rgba(10, 13, 12, 0.82);
  backdrop-filter: blur(3px);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
  text-align: center;
}
.hero-busy .ring {
  width: 30px; height: 30px;
  border: 2px solid var(--line-2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hero-empty {
  color: var(--text-3);
  opacity: 0.5;
  text-align: center;
  width: 70%;
}
.hero-empty svg, .hero-empty img.car-silhouette { width: 100%; height: auto; }
.hero-empty-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 4px;
}
.hero-actions {
  display: flex;
  gap: 8px;
}

<body>

<div id="app"></div>
<div id="toast"></div>

<script>
/* ==========================================================================
   GARAGE — single-file PWA
   sections:  STATE → STORAGE → UTILS → ICONS → SCREENS → ROUTER → INIT
========================================================================== */

/* =========================================================
   STATE
========================================================= */
const STATE = {
  vehicles: [],            // {id, year, make, model, trim, plate, mileage, unit, vin, note, heroPhoto, heroFloating, photos:[dataURL], services:[], reminders:[]}
  activeVehicleId: null,
  tab: 'home',             // home | services | settings
  detailTab: 'overview',   // overview | services | reminders | media
  sheet: null,             // {type, payload}
  defaultUnit: 'mi',
  // transient, never persisted
  _carouselIdx: 0,
  _tentativeUnit: null,
  _tentativeHero: undefined,        // undefined = untouched, null = cleared, string = new photo
  _tentativeHeroFloating: undefined,
  _tentativeHeroOriginal: null,     // pre-cutout photo, so "use original" can revert
  _heroBusy: null,                  // progress text while the cutout runs
  _minderCode: '',                  // what's typed in the Maintenance Minder box
  _svc: null,                       // service checklist: { checked:Set, chips:Set, extra:[] }
};

/* =========================================================
   STORAGE
   Primary store is IndexedDB (photos are base64 and blow past
   localStorage's ~5MB ceiling on iOS). localStorage is kept as a
   best-effort mirror / fallback, and as the migration source.
========================================================= */
const STORAGE_KEY = 'garage_v1';
const DB_NAME = 'garage';
const DB_STORE = 'kv';

let _db = null;
function openDB() {
  if (_db) return _db;
  _db = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => {
      req.result.onclose = () => { _db = null; }; // reopen lazily if the browser closes it
      resolve(req.result);
    };
    req.onerror = () => { _db = null; reject(req.error); };
  });
  return _db;
}

function dbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  }));
}

function snapshot() {
  return {
    vehicles: STATE.vehicles,
    activeVehicleId: STATE.activeVehicleId,
    defaultUnit: STATE.defaultUnit,
  };
}

function applySnapshot(data) {
  STATE.vehicles = data.vehicles || [];
  STATE.activeVehicleId = data.activeVehicleId || null;
  STATE.defaultUnit = data.defaultUnit || 'mi';
}

// Writes are fire-and-forget; a failure is surfaced instead of swallowed,
// because silently losing a service log is the one thing this app must not do.
let _persistWarned = false;
function persist() {
  const data = snapshot();
  const json = JSON.stringify(data);
  let mirrored = false;
  try { localStorage.setItem(STORAGE_KEY, json); mirrored = true; } catch (e) { /* over quota — IDB is primary */ }
  dbSet(STORAGE_KEY, data).catch(e => {
    console.error('persist failed', e);
    if (!mirrored && !_persistWarned) {
      _persistWarned = true;
      alert('Could not save — storage is full or unavailable. Export a backup and remove some photos.');
    }
  });
}

async function loadState() {
  let data = null;
  try { data = await dbGet(STORAGE_KEY); } catch (e) { console.warn('IndexedDB unavailable', e); }
  if (!data) {
    // First run on this version: migrate whatever localStorage has.
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) { console.error('load failed', e); }
    if (data) dbSet(STORAGE_KEY, data).catch(() => {});
  }
  if (data) applySnapshot(data);
}

async function exportJSON() {
  const data = { vehicles: STATE.vehicles, defaultUnit: STATE.defaultUnit, exportedAt: new Date().toISOString(), v: 1 };
  const name = `garage-backup-${toDateInput(Date.now())}.json`;
  const file = new File([JSON.stringify(data, null, 2)], name, { type: 'application/json' });

  // iOS standalone PWAs can't reliably trigger downloads; the share sheet
  // (Save to Files, AirDrop, etc.) is the path that actually works there.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Garage backup' });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // user dismissed the sheet
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Backup exported');
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.vehicles || !Array.isArray(data.vehicles)) throw new Error('bad file');
      if (!confirm(`Import ${data.vehicles.length} vehicle(s)? This replaces current data.`)) return;
      STATE.vehicles = data.vehicles;
      STATE.activeVehicleId = null;
      STATE.defaultUnit = data.defaultUnit || 'mi';
      persist();
      render();
      toast('Backup restored');
    } catch (err) {
      alert('Invalid backup file.');
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   UTILS
========================================================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtNum = n => (n == null || n === '') ? '—' : Number(n).toLocaleString();
const fmtDate = ts => {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};
// <input type="date"> speaks YYYY-MM-DD. Parse/format it as a LOCAL date:
// new Date('2026-09-11') is UTC midnight, which displays as Sep 10 anywhere
// west of Greenwich.
const fromDateInput = s => {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).getTime();
};
const toDateInput = ts => {
  if (!ts) return '';
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const fmtMoney = n => (n == null || n === '') ? '' : '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getActiveVehicle() {
  return STATE.vehicles.find(v => v.id === STATE.activeVehicleId);
}

// Toast lives in its own container outside #app so showing one never
// re-renders the screen (which would replay animations and wipe open forms).
function toast(msg) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.innerHTML = ''; }, 1800);
}

// Returns { dataURL, hasTransparency } so callers can render appropriately.
// Preserves PNG (with alpha) when source has transparency; otherwise compresses to JPEG.
function processImage(file, maxDim = 1280) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Detect transparency by sampling pixels (every 4th pixel for speed)
        let hasTransparency = false;
        let data = null;
        try {
          data = ctx.getImageData(0, 0, width, height).data;
          for (let i = 3; i < data.length; i += 16) { // step by 4 pixels (16 bytes)
            if (data[i] < 250) { hasTransparency = true; break; }
          }
        } catch (err) {
          // if getImageData fails (rare CORS issue with data URLs, shouldn't happen here)
          console.warn('Transparency check failed, assuming opaque', err);
        }

        // Cutouts usually arrive with big transparent margins; crop to the
        // visible pixels so the car fills the frame instead of floating small.
        let out = canvas;
        if (hasTransparency && data) {
          const box = alphaBounds(data, width, height);
          if (box) {
            const pad = Math.round(Math.max(box.w, box.h) * 0.03);
            const x = Math.max(0, box.x - pad), y = Math.max(0, box.y - pad);
            const w = Math.min(width - x, box.w + pad * 2), h = Math.min(height - y, box.h + pad * 2);
            out = document.createElement('canvas');
            out.width = w; out.height = h;
            out.getContext('2d').drawImage(canvas, x, y, w, h, 0, 0, w, h);
          }
        }

        const dataURL = hasTransparency
          ? out.toDataURL('image/png')             // preserve alpha
          : out.toDataURL('image/jpeg', 0.82);     // compress for size
        resolve({ dataURL, hasTransparency });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Bounding box of non-transparent pixels, or null if fully transparent
function alphaBounds(data, width, height) {
  let minX = width, minY = height, maxX = -1, maxY = -1;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (data[(y * width + x) * 4 + 3] > 16) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  return maxX < 0 ? null : { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

/* ---- Background removal (on-demand) ----
   The ISNet model via @imgly/background-removal, loaded from a CDN only when
   the user taps "Cut out car" — the app itself stays dependency-free.
   proxyToWorker:false is essential: the worker path throws DataCloneError on
   iOS Safari. First run downloads ~40 MB of model + runtime (browser-cached). */
let _bgRemoval = null;
function loadBackgroundRemoval() {
  if (!_bgRemoval) {
    _bgRemoval = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm')
      .catch(e => { _bgRemoval = null; throw e; });
  }
  return _bgRemoval;
}

async function removeBackground(dataURL, onProgress) {
  const { removeBackground } = await loadBackgroundRemoval();
  const src = await fetch(dataURL).then(r => r.blob());
  const blob = await removeBackground(src, {
    proxyToWorker: false,
    device: 'cpu',
    model: 'isnet_quint8',
    output: { format: 'image/png' },
    progress: (key, current, total) => {
      if (!onProgress) return;
      if (key.startsWith('fetch:')) onProgress(`Downloading model ${total ? Math.round(current / total * 100) : 0}%`);
      else onProgress('Cutting out car…');
    },
  });
  return processImage(new File([blob], 'cutout.png', { type: 'image/png' }));
}

// Index of the slide nearest the carousel's center
function carouselIndex(carousel) {
  const center = carousel.scrollLeft + carousel.clientWidth / 2;
  let bestIdx = 0, bestDist = Infinity;
  carousel.querySelectorAll('.slide').forEach((s, i) => {
    const dist = Math.abs(s.offsetLeft + s.offsetWidth / 2 - center);
    if (dist < bestDist) { bestDist = dist; bestIdx = i; }
  });
  return bestIdx;
}

function suggestManual(v) {
  return Object.keys(MANUALS).find(k => MANUALS[k].match(v)) || '';
}

// "B12" -> [{code:'B', ...}, {code:1, ...}, {code:2, ...}]; unknown chars flagged
function decodeMinder(code, manual) {
  const chars = String(code || '').toUpperCase().replace(/[^AB0-9]/g, '').split('');
  return chars.map(c => {
    const key = /\d/.test(c) ? Number(c) : c;
    const known = manual.minder.includes(key) && MINDER_CODES[key];
    return known ? { code: c, ...MINDER_CODES[key] } : { code: c, unknown: true };
  });
}

function minderOutputHTML(code, manual) {
  const items = decodeMinder(code, manual);
  if (!items.length) return '';
  const html = items.map(i => i.unknown
    ? `<div class="minder-item unknown"><div class="code">${i.code}</div><div class="what">Not a code for this car</div></div>`
    : `<div class="minder-item"><div class="code">${i.code}</div><div class="what">${i.title}${i.sub ? `<small>${i.sub}</small>` : ''}</div></div>`
  ).join('');
  const valid = items.filter(i => !i.unknown);
  return html + (valid.length ? `
    <button class="btn-pill" style="margin-top:12px;width:100%;justify-content:center;" onclick="action.addMinderToNeeded()">
      Add to Needed
    </button>` : '');
}

// Items a Minder code puts on the Needed list, e.g. B12 -> ['Engine oil & filter (B)', 'Rotate tires (1)', ...]
function minderNeededItems(code, manual) {
  return decodeMinder(code, manual).filter(i => !i.unknown).map(i => ({
    title: `${i.title.replace('engine oil and oil filter', 'engine oil & filter').replace('engine air cleaner element and cabin (dust & pollen) filter', 'engine air & cabin filters')} (${i.code})`,
    sub: i.sub || null,
  }));
}

// Display line for a service entry: its items, or the legacy free-text title
function serviceItems(s) {
  return s.items && s.items.length ? s.items : (s.title ? [s.title] : []);
}
function serviceSummary(s) {
  const items = serviceItems(s);
  if (!items.length) return 'Service';
  if (items.length <= 2) return items.join(' · ');
  return `${items[0]} · ${items[1]} · +${items.length - 2} more`;
}

// Build a friendly display name from year/make/model/trim
function vehicleDisplayName(v) {
  const parts = [v.year, v.make, v.model].filter(Boolean);
  if (parts.length) return parts.join(' ');
  return v.name || 'Unnamed Vehicle';
}

function reminderItemHTML(v, r) {
  const due = reminderDueIn(v, r);
  const cls = r.done ? '' : (due.overdue ? 'overdue' : (due.soon ? 'soon' : ''));
  return `
    <div class="reminder-item ${cls}">
      <div style="flex:1;min-width:0;" onclick="action.openSheet('editReminder', { id: '${r.id}' })">
        <div class="rtitle" style="${r.done ? 'text-decoration:line-through;color:var(--text-3)' : ''}">${escapeHtml(r.title)}</div>
        <div class="rmeta">${due.text}</div>

        ${r.done ? ICON.check : ''}
      </button>
    </div>
  `;
}

function reminderDueIn(v, r) {
  // Returns { text, overdue, soon, sortKey }
  if (r.done) return { text: 'Done', overdue: false, soon: false, sortKey: 1e15 };
  const parts = [];
  let overdue = false, soon = false, sortKey = 1e14;

  if (r.dueDate) {
    const due = new Date(r.dueDate);
    const today = new Date(); today.setHours(0,0,0,0);
    const diffDays = Math.round((due - today) / 86400000);
    sortKey = Math.min(sortKey, diffDays);
    if (diffDays < 0) { overdue = true; parts.push(`${-diffDays}d overdue`); }
    else if (diffDays === 0) { soon = true; parts.push('Due today'); }
    else if (diffDays <= 14) { soon = true; parts.push(`In ${diffDays}d`); }
    else { parts.push(`In ${diffDays}d`); }
  }
  if (r.dueMileage) {
    const remaining = Number(r.dueMileage) - Number(v.mileage || 0);
    sortKey = Math.min(sortKey, remaining / 40); // ~40 mi/day so mileage reminders rank against dated ones
    if (remaining < 0) { overdue = true; parts.push(`${fmtNum(-remaining)} ${v.unit || STATE.defaultUnit} past`); }
    else { parts.push(`${fmtNum(remaining)} ${v.unit || STATE.defaultUnit} away`); }
  }
  if (parts.length === 0) parts.push('No due set');
  return { text: parts.join(' · '), overdue, soon, sortKey };
}

// Does this vehicle have any overdue reminders?
function vehicleHasOverdue(v) {
  return (v.reminders || []).some(r => !r.done && reminderDueIn(v, r).overdue);
}

function renderSheet() {
  if (!STATE.sheet) return '';
  const { type, payload } = STATE.sheet;
  let body = '';

  switch (type) {
    case 'newVehicle': body = sheetVehicleForm(null); break;
    case 'editVehicle': body = sheetVehicleForm(getActiveVehicle()); break;
    case 'newService': body = sheetServiceForm(null, payload.check); break;
    case 'editService': {
      const v = getActiveVehicle();
      const s = (v.services || []).find(x => x.id === payload.id);
      body = sheetServiceForm(s);
      break;
    }
    case 'newReminder': body = sheetReminderForm(null); break;
    case 'editReminder': {
      const v = getActiveVehicle();
      const r = (v.reminders || []).find(x => x.id === payload.id);

      ${body}

}

/* =========================================================
   ROUTER / RENDER
========================================================= */
// Screen identity: when it doesn't change between renders (tab tap, reminder
// toggle, unit switch) we skip the entrance animation and keep scroll position,
// so the page doesn't blink and jump on every interaction.
let _lastScreenKey = null;

function render() {
  const app = $('#app');
  const screenKey = STATE.activeVehicleId ? `v:${STATE.activeVehicleId}` : `t:${STATE.tab}`;
  const sameScreen = screenKey === _lastScreenKey;
  const scrollY = window.scrollY;
  const sheetWasOpen = !!app.querySelector('.sheet');
  // Read the carousel position off the live DOM before we replace it
  const oldCarousel = document.getElementById('carousel');
  if (oldCarousel) STATE._carouselIdx = carouselIndex(oldCarousel);

  let main = '';
  if (STATE.activeVehicleId) {
    main = renderVehicleDetail();
  } else if (STATE.tab === 'home') {
    main = renderHome();
  } else if (STATE.tab === 'services') {
    main = renderServicesGlobal();
  } else if (STATE.tab === 'settings') {
    main = renderSettings();
  }

  app.classList.toggle('no-anim', sameScreen);
  app.classList.toggle('sheet-static', sheetWasOpen && !!STATE.sheet);
  app.innerHTML = main + renderNav() + renderSheet();
  _lastScreenKey = screenKey;

  if (sameScreen) window.scrollTo(0, scrollY);
  else window.scrollTo(0, 0);

  // Carousel: land on the car you were looking at, not the first one.
  const carousel = document.getElementById('carousel');
  if (carousel) {
    const slide = carousel.querySelector(`.slide[data-idx="${STATE._carouselIdx}"]`);
    // 'instant' — .carousel has scroll-behavior: smooth, and a smooth restore
    // fires onCarouselScroll mid-flight, which would overwrite _carouselIdx.
    if (slide) carousel.scrollTo({ left: slide.offsetLeft, behavior: 'instant' });
  }
}

function renderNav() {
  if (STATE.activeVehicleId) return '';
  const tab = STATE.tab;
  return `
    <nav class="bottomnav">
      <button class="navtab ${tab==='home'?'active':''}" onclick="action.setTab('home')">
        ${ICON.home}<span>Home</span>
      </button>
      <button class="navtab ${tab==='services'?'active':''}" onclick="action.setTab('services')">
        ${ICON.wrench}<span>Services</span>
      </button>
      <button class="navtab ${tab==='settings'?'active':''}" onclick="action.setTab('settings')">
        ${ICON.gear}<span>Settings</span>
      </button>
    </nav>
  `;
}

/* =========================================================
   ACTIONS  (every onclick goes through here)
========================================================= */
const action = {
  setTab(t) { STATE.tab = t; STATE.activeVehicleId = null; render(); },
  setDetailTab(t) { STATE.detailTab = t; render(); },
  openVehicle(id) { STATE.activeVehicleId = id; STATE.detailTab = 'overview'; persist(); render(); },
  openVehicleAtTab(id, t) { STATE.activeVehicleId = id; STATE.detailTab = t; persist(); render(); },
  closeVehicle() { STATE.activeVehicleId = null; STATE._minderCode = ''; persist(); render(); },

  onCarouselScroll() {
    if (action._scrollRAF) return;
    action._scrollRAF = requestAnimationFrame(() => {
      action._scrollRAF = null;
      const carousel = document.getElementById('carousel');
      if (carousel) STATE._carouselIdx = carouselIndex(carousel);
    });
  },

  openSheet(type, payload = {}) {
    STATE.sheet = { type, payload };
    if (type === 'newVehicle') {
      STATE._tentativeUnit = STATE.defaultUnit;
      STATE._tentativeHero = null;
      STATE._tentativeHeroFloating = undefined;
    }
    if (type === 'editVehicle') {
      const v = getActiveVehicle();
      STATE._tentativeUnit = v.unit || STATE.defaultUnit;
      STATE._tentativeHero = undefined; // undefined = use existing; null = explicitly cleared
      STATE._tentativeHeroFloating = undefined;
    }
    STATE._tentativeHeroOriginal = null;
    STATE._heroBusy = null;
    if (type === 'newService' || type === 'editService') {
      STATE._svc = { checked: new Set(), chips: new Set(), extra: [] };
      if (type === 'newService' && payload.check) STATE._svc.checked.add(payload.check);
      if (type === 'editService') {
        const v = getActiveVehicle();
        const svc = (v.services || []).find(x => x.id === payload.id);
        serviceItems(svc).forEach((_, i) => STATE._svc.checked.add(`i${i}`));
      }
    }
    render();
  },
  closeSheet() {
    STATE.sheet = null;
    STATE._tentativeUnit = null;
    STATE._tentativeHero = undefined;
    STATE._tentativeHeroFloating = undefined;
    STATE._tentativeHeroOriginal = null;
    STATE._heroBusy = null;
    render();
  },

  toggleVehicleUnit(u) {
    STATE._tentativeUnit = u;
    document.querySelectorAll('#f-unit button').forEach(b => b.classList.toggle('active', b.dataset.unit === u));
  },

  setUnit(u) { STATE.defaultUnit = u; persist(); render(); toast(`Default: ${u === 'mi' ? 'Miles' : 'Kilometers'}`); },

  // Auto-pick the manual when make/model match, unless the user already chose one
  suggestManual() {
    const sel = $('#f-manual');
    if (!sel || sel.value) return;
    sel.value = suggestManual({ make: $('#f-make').value, model: $('#f-model').value });
  },

  // Patches only the decoder output so the input keeps focus while typing
  setMinderCode(code) {
    STATE._minderCode = code;
    const v = getActiveVehicle(), manual = v && vehicleManual(v);
    const out = document.getElementById('minder-out');
    if (out && manual) out.innerHTML = minderOutputHTML(code, manual);
  },

  addMinderToNeeded() {
    const v = getActiveVehicle(), manual = v && vehicleManual(v);
    if (!manual) return;
    v.reminders = v.reminders || [];
    let added = 0;
    minderNeededItems(STATE._minderCode, manual).forEach(item => {
      if (v.reminders.some(r => !r.done && r.title === item.title)) return;
      v.reminders.push({ id: uid(), title: item.title, dueDate: fromDateInput(toDateInput(Date.now())), dueMileage: null, done: false });
      added++;
    });
    persist();
    STATE._minderCode = '';
    STATE.detailTab = 'reminders';
    render();
    toast(added ? `${added} item${added === 1 ? '' : 's'} added to Needed` : 'Already on the list');
  },

  // --- service checklist (patches DOM; never re-renders the open sheet) ---
  toggleSvcRow(key) {
    const svc = STATE._svc;
    svc.checked.has(key) ? svc.checked.delete(key) : svc.checked.add(key);
    const row = document.querySelector(`.check-row[data-key="${key}"]`);
    if (!row) return;
    const on = svc.checked.has(key);
    row.classList.toggle('on', on);
    row.querySelector('.tag').textContent = on ? 'Done' : (STATE.sheet.type === 'editService' ? 'Remove' : 'Later');
  },
  toggleSvcChip(label) {
    const svc = STATE._svc;
    svc.chips.has(label) ? svc.chips.delete(label) : svc.chips.add(label);
    updateSvcChips();
  },
  addSvcExtra() {
    const input = $('#f-sextra');
    const t = input.value.trim();
    if (!t) return;
    STATE._svc.extra.push(t);
    input.value = '';
    updateSvcChips();
  },
  removeSvcExtra(i) {
    STATE._svc.extra.splice(i, 1);
    updateSvcChips();
  },

  addManualReminders() {
    const v = getActiveVehicle();
    const manual = vehicleManual(v);
    if (!manual) return;
    v.reminders = v.reminders || [];
    let added = 0;
    manual.timed.forEach(t => {
      if (v.reminders.some(r => !r.done && r.title === t.title)) return;
      const due = new Date(); due.setMonth(due.getMonth() + t.months);
      v.reminders.push({ id: uid(), title: t.title, dueDate: due.getTime(), dueMileage: null, done: false });
      added++;
    });
    persist();
    render();
    toast(`${added} reminder${added === 1 ? '' : 's'} added`);
  },

  async stageHeroPhoto(file) {
    if (!file) return;
    try {
      const { dataURL, hasTransparency } = await processImage(file, 1280);
      STATE._tentativeHero = dataURL;
      STATE._tentativeHeroFloating = hasTransparency;
      STATE._tentativeHeroOriginal = null;
      updateHeroUploader(dataURL, hasTransparency);
    } catch (e) {
      console.error(e);
      alert('Could not process that photo.');
    }
  },

  async cutOutHero() {
    const original = STATE._tentativeHero ?? getActiveVehicle()?.heroPhoto;
    if (!original || STATE._heroBusy) return;
    STATE._heroBusy = 'Loading…';
    updateHeroUploader(original, false);
    try {
      const { dataURL, hasTransparency } = await removeBackground(original, msg => {
        STATE._heroBusy = msg;
        const el = document.querySelector('.hero-busy div');
        if (el) el.lastChild.textContent = msg;
      });
      if (!hasTransparency) throw new Error('no subject found');
      STATE._tentativeHeroOriginal = original;
      STATE._tentativeHero = dataURL;
      STATE._tentativeHeroFloating = true;
    } catch (e) {
      console.error('cutout failed', e);
      alert("Couldn't cut out the car. Check your connection and try again — or in the Photos app, press and hold the car, tap Copy Subject, and paste it into a new image.");
    }
    STATE._heroBusy = null;
    updateHeroUploader(STATE._tentativeHero ?? original, !!STATE._tentativeHeroFloating);
  },

  restoreHeroOriginal() {
    if (!STATE._tentativeHeroOriginal) return;
    STATE._tentativeHero = STATE._tentativeHeroOriginal;
    STATE._tentativeHeroFloating = false;
    STATE._tentativeHeroOriginal = null;
    updateHeroUploader(STATE._tentativeHero, false);
  },

  clearHeroPhoto() {
    STATE._tentativeHero = null;
    STATE._tentativeHeroFloating = false;
    STATE._tentativeHeroOriginal = null;
    updateHeroUploader(null, false);
  },

  saveVehicle(id) {
    const make = $('#f-make').value.trim();
    const model = $('#f-model').value.trim();
    if (!make && !model) { alert('Make or Model is required.'); return; }

    const data = {
      make,
      model,
      trim: $('#f-trim').value.trim(),
      plate: $('#f-plate').value.trim(),
      mileage: $('#f-mileage').value ? Number($('#f-mileage').value) : null,
      unit: STATE._tentativeUnit || STATE.defaultUnit,
      year: $('#f-year').value ? Number($('#f-year').value) : null,
      vin: $('#f-vin').value.trim(),
      note: $('#f-note').value,
      manual: $('#f-manual').value || null,
    };

    // Hero photo handling
    if (STATE._tentativeHero !== undefined) {
      data.heroPhoto = STATE._tentativeHero; // may be null (cleared) or string (new)
      data.heroFloating = !!STATE._tentativeHeroFloating;
    }

    if (id) {
      const v = STATE.vehicles.find(x => x.id === id);
      Object.assign(v, data);
      // Migration: drop legacy "name" field if present
      delete v.name;
    } else {
      STATE.vehicles.push({
        id: uid(),
        ...data,
        photos: [],
        services: [],
        reminders: []
      });
    }
    persist();
    STATE.sheet = null;
    STATE._tentativeUnit = null;
    STATE._tentativeHero = undefined;
    STATE._tentativeHeroFloating = undefined;
    STATE._tentativeHeroOriginal = null;
    STATE._heroBusy = null;
    render();
    toast(id ? 'Vehicle updated' : 'Parked!');
  },

  deleteVehicle(id) {
    if (!confirm('Delete this vehicle and all its data? Cannot be undone.')) return;
    STATE.vehicles = STATE.vehicles.filter(v => v.id !== id);
    STATE.activeVehicleId = null;
    STATE.sheet = null;
    persist();
    render();
    toast('Vehicle deleted');
  },

  saveService(id) {
    const v = getActiveVehicle();
    const svc = STATE._svc;
    v.services = v.services || [];
    v.reminders = v.reminders || [];
    const existing = id ? v.services.find(x => x.id === id) : null;

    // Items = ticked rows + chips + free-text, de-duplicated
    const doneNeeded = id ? [] : v.reminders.filter(r => svc.checked.has(r.id));
    const keptItems = id ? serviceItems(existing).filter((_, i) => svc.checked.has(`i${i}`)) : doneNeeded.map(r => r.title);
    const items = [...new Set([...keptItems, ...svc.chips, ...svc.extra])];
    if (!items.length) { alert('Tick or add at least one item.'); return; }

    const date = fromDateInput($('#f-sdate').value) ?? Date.now();
    const data = {
      items,
      title: items.join(' · '),
      date,
      mileage: $('#f-smileage').value ? Number($('#f-smileage').value) : null,
      cost: $('#f-scost').value ? Number($('#f-scost').value) : null,
      note: $('#f-snote').value,
    };

    if (existing) {
      Object.assign(existing, data);
    } else {
      const entry = { id: uid(), ...data };
      v.services.push(entry);
      if (data.mileage && (!v.mileage || data.mileage > v.mileage)) v.mileage = data.mileage;

      // Ticked Needed items are complete; anything on "Later" is untouched
      doneNeeded.forEach(r => { r.done = true; r.completedAt = date; r.serviceId = entry.id; });

      // The manual's calendar rules roll forward from this service
      const manual = vehicleManual(v);
      if (manual) manual.timed.forEach(t => {
        if (!doneNeeded.some(r => r.title === t.title)) return;
        const due = new Date(date); due.setMonth(due.getMonth() + t.months);
        v.reminders.push({ id: uid(), title: t.title, dueDate: due.getTime(), dueMileage: null, done: false });
      });
    }
    persist();
    STATE.sheet = null;
    STATE._svc = null;
    render();
    toast(id ? 'Service updated' : `Logged ${items.length} item${items.length === 1 ? '' : 's'}`);
  },

  deleteService(id) {
    if (!confirm('Delete this service entry?')) return;
    const v = getActiveVehicle();
    v.services = (v.services || []).filter(s => s.id !== id);
    persist();
    STATE.sheet = null;
    render();
    toast('Deleted');
  },

  saveReminder(id) {
    const v = getActiveVehicle();
    const title = $('#f-rtitle').value.trim();
    if (!title) { alert('Title is required.'); return; }
    const dateVal = $('#f-rdate').value;
    const data = {
      title,
      dueDate: fromDateInput(dateVal),
      dueMileage: $('#f-rmileage').value ? Number($('#f-rmileage').value) : null,
    };
    v.reminders = v.reminders || [];
    if (id) {
      const r = v.reminders.find(x => x.id === id);
      Object.assign(r, data);
    } else {
      v.reminders.push({ id: uid(), done: false, ...data });
    }
    persist();
    STATE.sheet = null;
    render();
    toast(id ? 'Reminder updated' : 'Reminder set');
  },

  deleteReminder(id) {
    if (!confirm('Delete this reminder?')) return;
    const v = getActiveVehicle();
    v.reminders = (v.reminders || []).filter(r => r.id !== id);
    persist();
    STATE.sheet = null;
    render();
    toast('Deleted');
  },

  async addPhotos(files) {
    const v = getActiveVehicle();
    v.photos = v.photos || [];
    for (const file of files) {
      try {
        const { dataURL } = await processImage(file);
        v.photos.push(dataURL);
      } catch (e) { console.error(e); }
    }
    persist();
    render();
    toast(`${files.length} photo${files.length>1?'s':''} added`);
  },

  deletePhoto(idx) {
    if (!confirm('Delete this photo?')) return;
    const v = getActiveVehicle();
    v.photos.splice(idx, 1);
    persist();
    render();
  },

  exportData() { exportJSON(); },

  importData(file) {
    if (!file) return;
    importJSON(file);
  },

  wipeData() {
    if (!confirm('Wipe ALL data? This cannot be undone.')) return;
    if (!confirm('Are you absolutely sure?')) return;
    STATE.vehicles = [];
    STATE.activeVehicleId = null;
    STATE.sheet = null;
    STATE.tab = 'home';
    persist();
    render();
    toast('All data wiped');
  },
};

window.action = action;

/* =========================================================
   INIT
========================================================= */
loadState().then(render);
</script>
</body>
</html>
